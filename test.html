<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cello Translator Tests</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tests { list-style: none; margin: 0; padding: 0; }
    .tests li { display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .tests .label { padding-top: 4px; }
    .tests li.fail, .tests li.fail .label { color: var(--clash); }
    .tests small { display: block; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <p class="label"><a href="index.html">The Cello Translator</a></p>
      <h1>Tests</h1>
      <p class="lede" id="summary"></p>
    </header>
    <div id="groups"></div>
  </main>
  <script type="module">
    import { results } from "./js/tests.js";
    const groups = [...new Set(results.map((r) => r.group))];
    document.getElementById("groups").innerHTML = groups.map((g) => `
      <section><h2 class="label">${g}</h2><ul class="tests">${results.filter((r) => r.group === g).map((r) => `
        <li class="${r.ok ? "" : "fail"}"><span class="label">${r.ok ? "Pass" : "Fail"}</span><span>${r.name}${r.ok ? "" : `<small>${r.error}</small>`}</span></li>`).join("")}
      </ul></section>`).join("");
    const failed = results.filter((r) => !r.ok).length;
    document.getElementById("summary").textContent = failed ? `${failed} of ${results.length} failed.` : `All ${results.length} passed.`;
  </script>
</body>
</html>
